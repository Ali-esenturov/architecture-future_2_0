name: Terraform CI/CD

on:
  pull_request:
    branches: [main]
    paths: ["Task2Advanced/**"]
  push:
    branches: [main]
    paths: ["Task2Advanced/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, stage, prod]
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan

# Prevent concurrent runs for the same environment to avoid state corruption
concurrency:
  group: terraform-${{ github.event.inputs.environment || 'all' }}
  cancel-in-progress: false

# ── DEV ────────────────────────────────────────────────────────────────────────
jobs:
  plan-dev:
    name: "Plan · dev"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task2Advanced/envs/dev
    env:
      YC_TOKEN:              ${{ secrets.YC_TOKEN }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.YC_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
      TF_VAR_folder_id:      ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_subnet_id:      ${{ secrets.YC_SUBNET_ID_DEV }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -var-file=dev.tfvars -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: Task2Advanced/envs/dev/tfplan
          retention-days: 1

  apply-dev:
    name: "Apply · dev"
    needs: plan-dev
    runs-on: ubuntu-latest
    # Auto-apply on push to main; manual apply via workflow_dispatch
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == 'dev' &&
       github.event.inputs.action == 'apply')
    environment: dev   # ← requires manual approval configured in GitHub Settings
    defaults:
      run:
        working-directory: Task2Advanced/envs/dev
    env:
      YC_TOKEN:              ${{ secrets.YC_TOKEN }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.YC_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: Task2Advanced/envs/dev/

      - name: Init
        run: terraform init

      - name: Apply
        run: terraform apply -auto-approve tfplan

  destroy-dev:
    name: "Destroy · dev"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'dev' &&
      github.event.inputs.action == 'destroy'
    environment: dev
    defaults:
      run:
        working-directory: Task2Advanced/envs/dev
    env:
      YC_TOKEN:              ${{ secrets.YC_TOKEN }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.YC_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
      TF_VAR_folder_id:      ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_subnet_id:      ${{ secrets.YC_SUBNET_ID_DEV }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Init
        run: terraform init
      - name: Destroy
        run: terraform destroy -auto-approve -var-file=dev.tfvars

# ── STAGE ──────────────────────────────────────────────────────────────────────
  plan-stage:
    name: "Plan · stage"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task2Advanced/envs/stage
    env:
      YC_TOKEN:              ${{ secrets.YC_TOKEN }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.YC_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
      TF_VAR_folder_id:      ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_subnet_id:      ${{ secrets.YC_SUBNET_ID_STAGE }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Init
        run: terraform init
      - name: Validate
        run: terraform validate
      - name: Plan
        run: terraform plan -var-file=stage.tfvars -out=tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-stage
          path: Task2Advanced/envs/stage/tfplan
          retention-days: 1

  apply-stage:
    name: "Apply · stage"
    needs: [apply-dev, plan-stage]   # stage deploys only after dev succeeds
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'stage' &&
      github.event.inputs.action == 'apply'
    environment: stage
    defaults:
      run:
        working-directory: Task2Advanced/envs/stage
    env:
      YC_TOKEN:              ${{ secrets.YC_TOKEN }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.YC_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-stage
          path: Task2Advanced/envs/stage/
      - name: Init
        run: terraform init
      - name: Apply
        run: terraform apply -auto-approve tfplan

  destroy-stage:
    name: "Destroy · stage"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'stage' &&
      github.event.inputs.action == 'destroy'
    environment: stage
    defaults:
      run:
        working-directory: Task2Advanced/envs/stage
    env:
      YC_TOKEN:              ${{ secrets.YC_TOKEN }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.YC_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
      TF_VAR_folder_id:      ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_subnet_id:      ${{ secrets.YC_SUBNET_ID_STAGE }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Init
        run: terraform init
      - name: Destroy
        run: terraform destroy -auto-approve -var-file=stage.tfvars

# ── PROD ───────────────────────────────────────────────────────────────────────
  plan-prod:
    name: "Plan · prod"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task2Advanced/envs/prod
    env:
      YC_TOKEN:              ${{ secrets.YC_TOKEN }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.YC_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
      TF_VAR_folder_id:      ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_subnet_id:      ${{ secrets.YC_SUBNET_ID_PROD }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Init
        run: terraform init
      - name: Validate
        run: terraform validate
      - name: Plan
        run: terraform plan -var-file=prod.tfvars -out=tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: Task2Advanced/envs/prod/tfplan
          retention-days: 1

  apply-prod:
    name: "Apply · prod"
    needs: [apply-stage, plan-prod]  # prod deploys only after stage succeeds
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'prod' &&
      github.event.inputs.action == 'apply'
    environment: prod
    defaults:
      run:
        working-directory: Task2Advanced/envs/prod
    env:
      YC_TOKEN:              ${{ secrets.YC_TOKEN }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.YC_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: Task2Advanced/envs/prod/
      - name: Init
        run: terraform init
      - name: Apply
        run: terraform apply -auto-approve tfplan

  destroy-prod:
    name: "Destroy · prod"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'prod' &&
      github.event.inputs.action == 'destroy'
    environment: prod
    defaults:
      run:
        working-directory: Task2Advanced/envs/prod
    env:
      YC_TOKEN:              ${{ secrets.YC_TOKEN }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.YC_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
      TF_VAR_folder_id:      ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_subnet_id:      ${{ secrets.YC_SUBNET_ID_PROD }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Init
        run: terraform init
      - name: Destroy
        run: terraform destroy -auto-approve -var-file=prod.tfvars
